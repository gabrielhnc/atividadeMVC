<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a th:href="@{/livros}">Livros</a>
</nav>
<main>
    <h1>Livros</h1>

    <h2>Cadastrar livro</h2>
    <form class="cadastro-livro" th:action="@{/livros}" method="post">
        <input name="titulo" placeholder="Título" required>
        <input name="isbn" placeholder="ISBN" required>
        <input name="autor.nome" placeholder="Autor" required>
        <input name="autor.nacionalidade" placeholder="Nacionalidade">
        <input name="autor.obrasPublicadas" type="number" min="0" value="0" required>
        <input name="categoria.nome" placeholder="Categoria" required>
        <input name="categoria.classificacao" placeholder="Classificação">
        <button type="submit">Cadastrar</button>
    </form>

    <div class="tabela-livros">
        <table>
            <thead>
            <tr>
                <th>Título</th>
                <th>ISBN</th>
                <th>Autor</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="livro, indice : ${livros}">
                <td th:text="${livro.titulo}"></td>
                <td th:text="${livro.isbn}"></td>
                <td th:text="${livro.autor.nome}"></td>
                <td th:text="${livro.categoria.nome}"></td>
                <td class="acoes">
                    <button type="button"
                            th:onclick="|document.getElementById('modal-livro-${indice.index}').showModal()|">
                        Editar
                    </button>
                    <dialog th:id="|modal-livro-${indice.index}|">
                        <h2>Editar livro</h2>
                        <form class="edicao-livro"
                              th:action="@{/livros/atualizar/{indice}(indice=${indice.index})}"
                              method="post">
                            <input type="hidden" name="_method" value="put">
                            <input name="titulo" th:value="${livro.titulo}" placeholder="Título" required>
                            <input name="isbn" th:value="${livro.isbn}" placeholder="ISBN" required>
                            <input name="autor.nome" th:value="${livro.autor.nome}" placeholder="Autor" required>
                            <input name="autor.nacionalidade" th:value="${livro.autor.nacionalidade}" placeholder="Nacionalidade">
                            <input name="autor.obrasPublicadas" type="number" min="0" th:value="${livro.autor.obrasPublicadas}" required>
                            <input name="categoria.nome" th:value="${livro.categoria.nome}" placeholder="Categoria" required>
                            <input name="categoria.classificacao" th:value="${livro.categoria.classificacao}" placeholder="Classificação">
                            <button type="submit">Salvar</button>
                        </form>
                    </dialog>
                    <form th:action="@{/livros/excluir/{indice}(indice=${indice.index})}" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <button class="botao-excluir" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
